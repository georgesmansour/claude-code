# nginx site config for the web container.
#
# This file replaces netlify.toml: the /api/* proxy and the /invite/* rewrite that
# used to be Netlify [[redirects]] are now plain nginx rules, and the extensionless
# URL handling mirrors the RewriteOptions in the API's Program.cs.

server {
    listen      80;
    # IPv6 too. The base image's 10-listen-on-ipv6-by-default.sh only patches the config it
    # ships, and skips ours ("differs from the packaged version") — so without this line
    # nothing answers on ::1, and anything inside the container resolving "localhost" to the
    # IPv6 address gets connection refused while external IPv4 traffic works fine.
    listen      [::]:80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Uploads are capped at 15 MB server-side (Media:MaxVideoBytes); leave headroom
    # for multipart overhead so nginx never rejects a request the API would accept.
    client_max_body_size 20m;

    # Emit RELATIVE Location headers. nginx builds absolute redirects from $host, which does not
    # carry the published port — so /templates/wedding/elegant-noir would 301 to
    # http://localhost/... (port 80, nothing there) instead of http://localhost:8080/....
    # A relative Location is resolved by the browser against the current origin, port included.
    absolute_redirect off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ── API proxy ────────────────────────────────────────────────────────────
    # "api" is the compose service name, resolved over Docker's embedded DNS (127.0.0.11).
    #
    # The upstream goes through a VARIABLE on purpose. With a literal hostname, nginx resolves
    # it once at startup: it refuses to start at all if the API is down, and it pins that first
    # IP forever — so after "docker compose restart api" the site 502s until nginx is restarted
    # too. A variable defers resolution to request time and re-checks it every 10s.
    # $request_uri is required in this form, since the variable syntax does not append the
    # matched URI automatically; /api/public/x still arrives at the API as /api/public/x.
    location /api/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $api_upstream http://api:8080;
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Media streaming: don't buffer, and allow a slow upload/download to run.
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    # ── Container health (used by HEALTHCHECK, not by the app) ────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Personal guest links ─────────────────────────────────────────────────
    # /invite/<name-slug> has no file behind it; the dispatcher reads the slug client-side.
    location ^~ /invite/ {
        try_files $uri /invitation.html;
        add_header Cache-Control "no-cache" always;
    }

    # ── Config script ────────────────────────────────────────────────────────
    # Exact match wins over the asset regex below, so a redeploy is never masked by a
    # cached copy pointing at the wrong API. (Was the old "works only after Ctrl+F5" bug.)
    location = /shared/config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── Long-lived static assets ─────────────────────────────────────────────
    # Only add_header here — an "expires" directive would emit a SECOND Cache-Control line
    # alongside this one, which is ambiguous for intermediary caches.
    location ~* \.(css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|mp4|webm|ogg|mp3)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ── Pages ────────────────────────────────────────────────────────────────
    # $uri.html turns /admin into /admin.html; $uri/ lets a template folder
    # (/templates/wedding/elegant-noir) resolve to its index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
