<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400" role="img" aria-label="Wedding cake with florals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e8"/><stop offset="1" stop-color="#ece0cf"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="1400" fill="url(#bg)"/>
  <circle cx="700" cy="600" r="330" fill="#f9f4ea" opacity=".7"/>

  <!-- stand -->
  <path d="M560 1150h280l-40 60H600z" fill="#cdb08a"/>
  <rect x="660" y="1080" width="80" height="80" fill="#d8c3a0"/>
  <ellipse cx="700" cy="1080" rx="230" ry="30" fill="#e4d3b4"/>

  <!-- tiers -->
  <g stroke="#dcc9ab" stroke-width="3">
    <rect x="520" y="880" width="360" height="200" rx="10" fill="#fbf7f0"/>
    <rect x="570" y="700" width="260" height="180" rx="10" fill="#f8f2e8"/>
    <rect x="614" y="546" width="172" height="154" rx="10" fill="#fbf7f0"/>
  </g>
  <!-- piping -->
  <g fill="none" stroke="#e6d5b8" stroke-width="6">
    <path d="M520 900q30 22 60 0T640 900t60 0 60 0 60 0 60 0"/>
    <path d="M570 720q26 20 52 0t52 0 52 0 52 0 52 0"/>
    <path d="M614 566q22 18 44 0t44 0 44 0 40 0"/>
  </g>

  <!-- florals on tiers -->
  <g>
    <g transform="translate(700,540)">
      <circle r="26" fill="#eddcd8"/><circle r="13" fill="#d9b6b0"/>
      <ellipse cx="-38" cy="8" rx="26" ry="11" fill="#b3c3a6"/>
      <ellipse cx="38" cy="8" rx="26" ry="11" fill="#b3c3a6"/>
      <circle cx="-34" cy="-4" r="15" fill="#f0e2de"/><circle cx="34" cy="-4" r="15" fill="#f0e2de"/>
    </g>
    <g transform="translate(590,706)">
      <circle r="22" fill="#f0e2de"/><circle r="11" fill="#dcbdb7"/>
      <ellipse cx="30" cy="8" rx="24" ry="10" fill="#b3c3a6"/>
    </g>
    <g transform="translate(846,890)">
      <circle r="26" fill="#eddcd8"/><circle r="13" fill="#d9b6b0"/>
      <ellipse cx="-32" cy="10" rx="26" ry="11" fill="#b3c3a6"/>
      <circle cx="-30" cy="-6" r="14" fill="#f0e2de"/>
    </g>
    <g transform="translate(556,1004)">
      <circle r="20" fill="#f0e2de"/><circle r="10" fill="#dcbdb7"/>
      <ellipse cx="28" cy="6" rx="22" ry="9" fill="#b3c3a6"/>
    </g>
  </g>

  <!-- cake topper -->
  <g transform="translate(700,470)" fill="none" stroke="#b99a6b" stroke-width="8" stroke-linecap="round">
    <circle cx="-20" cy="0" r="30"/><circle cx="20" cy="0" r="30"/>
  </g>

  <g opacity=".5" fill="#cfa97f">
    <circle cx="360" cy="1180" r="6"/><circle cx="1040" cy="1200" r="6"/><circle cx="280" cy="1260" r="5"/>
  </g>
</svg>
